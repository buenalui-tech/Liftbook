<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liftbook</title>
<meta name="description" content="Workout log with progression targets, rest timer and records.">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Liftbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 560px) with a bottom tab bar; a live workout takes over the column. Colors borrow from calibrated bumper plates. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E7EC; --ink:#121820; --muted:#5A6573; --line:#D3D9E0;
  --accent:#1B4FD6; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --pr:#C81F34; --pr-soft:#FBE1E4; --good:#1B7D44; --good-soft:#DDF1E5; --warn:#8F6200; --warn-soft:#FBEFCF;
  --plate-red:#D2263A; --plate-blue:#1B4FD6; --plate-yellow:#E9B90C; --plate-green:#1E8449; --plate-white:#F4F6F8; --plate-black:#2A2F36; --plate-edge:#8A949F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --lean:#CF4850; --fat:#F6D365; --fat-edge:#C99A12; --skin:#C3CAD3;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lean:#C9434C; --fat:#EDC54A; --fat-edge:#FFE08A; --skin:#56606C;
  --bg:#0D1116; --surface:#161B22; --sunk:#1E242C; --ink:#E7EBF0; --muted:#95A0AD; --line:#2A313A;
  --accent:#6A93FF; --accent-ink:#08101F; --accent-soft:#1A2540;
  --pr:#FF6275; --pr-soft:#3A1820; --good:#45C47E; --good-soft:#143023; --warn:#F2B632; --warn-soft:#352A0E;
  --plate-white:#C9CFD6; --plate-black:#0A0C0F; --plate-edge:#5B6570;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --lean:#C9434C; --fat:#EDC54A; --fat-edge:#FFE08A; --skin:#56606C;
  --bg:#0D1116; --surface:#161B22; --sunk:#1E242C; --ink:#E7EBF0; --muted:#95A0AD; --line:#2A313A;
  --accent:#6A93FF; --accent-ink:#08101F; --accent-soft:#1A2540;
  --pr:#FF6275; --pr-soft:#3A1820; --good:#45C47E; --good-soft:#143023; --warn:#F2B632; --warn-soft:#352A0E;
  --plate-white:#C9CFD6; --plate-black:#0A0C0F; --plate-edge:#5B6570;
  color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:18px}

/* type */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--pr);border-color:var(--pr)}
.btn.danger.armed{background:var(--pr);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.block{width:100%}
.btn.lg{font-size:18px;min-height:52px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.hold{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--warn-soft);color:var(--warn)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:600;color:var(--ink);font-size:13px}
.day.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today i{border-color:var(--accent)}

/* up next */
.next{border:2px solid var(--accent)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .nm{font-weight:600;min-width:0}
.plan .tg{font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted);text-align:right}
.plan .ht{grid-column:1/-1;font-size:13px;color:var(--muted)}
.plan .ht b{font-weight:600}
.plan .ht.up b{color:var(--good)}
.routine-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.routine-row:first-of-type{border-top:0}
.tag{font-family:var(--display);font-weight:700;font-size:15px;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);flex:none}

.resume{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.resume button{pointer-events:auto;max-width:528px;width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}

/* live workout */
.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.clock{font-family:var(--display);font-weight:700;font-size:24px}
.ex{padding:14px 12px}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-head h3{flex:1;min-width:0}
.ex-meta{font-size:13px;color:var(--muted)}
.hint{font-size:13px;border-radius:8px;padding:7px 10px;background:var(--sunk)}
.hint.up{background:var(--good-soft);color:var(--good)}
.hint.hold{background:var(--accent-soft);color:var(--accent)}
.hint.new{background:var(--warn-soft);color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:4px}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) 70px 58px 44px;gap:6px;align-items:center;border-radius:8px;padding:3px 2px}
.set.hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:0}
.set.hd span:nth-child(n+3){text-align:center}
.set.done{background:var(--good-soft)}
.set .lbl{height:36px;border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:18px;border-radius:6px}
.set .lbl.warm{color:var(--warn)}
.set .prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);text-align:center;font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;padding:0 4px}
.set input::placeholder{color:var(--muted);opacity:.7}
.set.done input{background:transparent;border-color:transparent}
.check{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{width:20px;height:20px}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.ex-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu .btn{min-height:36px;padding:6px 10px;font-size:14px}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}

/* plates */
.plates{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar{display:flex;align-items:center;gap:2px;height:40px}
.bar .shaft{width:26px;height:6px;background:var(--plate-edge);border-radius:2px}
.bar .collar{width:6px;height:14px;background:var(--plate-edge);border-radius:2px}
.plate{width:9px;border-radius:2px;border:1px solid rgba(0,0,0,.18)}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.rest .in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rest .t{font-family:var(--display);font-weight:700;font-size:30px;min-width:74px}
.rest .track{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.rest .fill{height:100%;background:var(--accent);width:0}
.rest button{background:transparent;border:1px solid rgba(127,127,127,.5);color:inherit;border-radius:8px;min-height:38px;padding:4px 10px;font-weight:600}
.rest.over .t{color:var(--plate-yellow)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 10px;font-size:16px;font-weight:500;color:var(--ink)}
.lib{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.lib button{text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.lib button:first-child{border-top:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;width:100%}
.hitem .kv{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hitem .kv b{color:var(--ink);font-weight:600}
.dtable{width:100%;border-collapse:collapse;font-size:14px}
.dtable td{padding:4px 0;border-top:1px solid var(--line)}
.dtable td:last-child{text-align:right}

.grid12{display:grid;grid-template-columns:auto repeat(12,1fr);gap:4px;align-items:center}
.grid12 .c{aspect-ratio:1;border-radius:3px;background:var(--sunk);max-width:100%}
.grid12 .c.on{background:var(--accent)}
.grid12 .c.fut{background:transparent}
.grid12 .dl{font-size:10px;color:var(--muted);padding-right:4px}

.mbar{display:grid;grid-template-columns:92px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.mbar .tr{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mbar .band{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.mbar .val{position:absolute;top:2px;bottom:2px;left:0;border-radius:4px;background:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}

/* program editor */
.edrow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.edrow:first-child{border-top:0}
.ednums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:6px;align-items:end}
.ednums .field input{height:40px;text-align:center;padding:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.banner{font-size:13px;border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.prlist{display:flex;flex-direction:column;gap:6px}
.syncpill{border:0;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);min-height:0}
.syncpill:empty{display:none}
.syncpill.ok{background:var(--good-soft);color:var(--good)}
.syncpill.ok::before{content:"✓ "}
.syncpill.busy{background:var(--accent-soft);color:var(--accent)}
.syncpill.err{background:var(--pr-soft);color:var(--pr)}
/* body tab */
.wt-hero{display:flex;flex-direction:column;gap:2px}
.wt-hero .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.wt-hero span{color:var(--muted);font-weight:600}
.wt-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.wt-form .field input{min-width:0;width:100%}
.wt-form .field:not(.grow){width:150px}
.goal{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.mini{width:64px;height:36px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
details summary{cursor:pointer;padding-block:6px}
.weigh{flex-direction:row}
.avatar-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:360px){.avatar-wrap{grid-template-columns:1fr}}
.avatar{position:relative;max-width:260px;width:100%;margin:0 auto}
.avatar svg{width:100%;height:auto;display:block;overflow:visible}
.avatar svg text{fill:var(--muted);font:600 11px var(--body)}
.avatar .skin{fill:var(--skin)}
.avatar .fat{fill:var(--fat);stroke:var(--fat-edge);stroke-width:1}
.avatar .lean{fill:var(--lean)}
.avatar .ghost{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 3;opacity:.55;pointer-events:none}
.avatar .seg{cursor:pointer}
.avatar .seg.sel .fat{stroke:var(--accent);stroke-width:2.5}
.avatar svg.example{opacity:.55}
.ex-tag{position:absolute;top:0;left:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sunk);color:var(--muted);padding:2px 8px;border-radius:999px}
.stat-line{display:flex;flex-direction:column}
.stat-line b{font-family:var(--display);font-size:24px;font-weight:700}
.stat-line small{color:var(--muted);font-weight:600}
.d{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.d.good{color:var(--good)}
.d.bad{color:var(--pr)}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.lean-sw{background:var(--lean)} .fat-sw{background:var(--fat);border:1px solid var(--fat-edge)} .ghost-sw{border:1.5px dashed var(--ink);opacity:.6}
.segtable,.scan-seg{width:100%;border-collapse:collapse;font-size:14px}
.segtable th,.scan-seg th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:4px}
.segtable td{padding:7px 4px;border-top:1px solid var(--line)}
.segtable tr{cursor:pointer}
.segtable tr.sel td{background:var(--accent-soft)}
.scan-seg td{padding:3px 4px}
.scan-seg td:first-child{font-weight:600;white-space:nowrap}
.scan-seg input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);text-align:center;font-size:16px}
.scan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
/* muscle map + share */
.fig-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:360px){.fig-wrap{grid-template-columns:1fr}}
.fig-host{height:300px;display:flex;border-radius:10px;background:var(--sunk)}
.avatar .body-host{height:380px}
.fig-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.main-sw{background:var(--lean)} .also-sw{background:#F2A0A5}
.share-preview{display:flex;justify-content:center;align-items:center;min-height:320px;background:var(--sunk);border-radius:12px;padding:12px}
.share-preview img{max-height:62vh;width:auto;max-width:100%;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18);-webkit-touch-callout:default}
.ed-ex{padding-block:10px;border-top:1px solid var(--line)}
.ed-set{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.ed-set.ed-hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ed-set input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);text-align:center;font-family:var(--display);font-weight:600;font-size:18px;min-width:0;width:100%}
.ed-set .lbl{height:36px;border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:17px}
.ed-set .lbl.warm{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.set.done{transition:background .2s}.rest .fill{transition:width .25s linear}}
</style>

  }).join('');
  const left = S.rest ? (S.rest.endAt - Date.now()) / 1000 : 0;
  const rest = S.rest ? `<div class="rest ${left <= 0 ? 'over' : ''}" id="rest"><div class="in">
      <span class="t num" id="rest-t">${left > 0 ? fmtDur(Math.ceil(left)) : 'Go'}</span>
      <div class="track"><div class="fill" id="rest-f" style="width:${Math.min(100, Math.max(0, 100 * (1 - left / S.rest.total)))}%"></div></div>
      <button data-act="rest-add" data-v="-15">−15</button><button data-act="rest-add" data-v="15">+15</button><button data-act="rest-skip">Skip</button></div></div>` : '';
  return `<div class="wrap" style="padding-bottom:${S.rest ? 120 : 40}px">
    <div class="wbar"><button class="iconbtn" data-act="minimize" aria-label="Back to tabs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="grow stack" style="gap:0"><span class="small muted">${esc(a.routineName)} · <span class="num">${done}/${total}</span> sets</span><span class="clock num" id="clock">${fmtDur((Date.now() - a.startedAt) / 1000)}</span></div>

    <p class="small muted">Tap a set number to mark it as a warm-up. Warm-ups don't count toward records or progression.</p>
  </div>${rest}`;
}

      <table class="dtable num"><tbody>${e.sets.map((s, i) => `<tr><td class="muted">${s.warm ? 'Warm-up' : 'Set ' + (i + 1)}</td><td>${e.timed ? `${s.r}s` : (s.w ? `${fmtW(conv(s.w, w.unit))} ${unit()} × ${s.r}` : `${s.r} reps`)}</td></tr>`).join('')}</tbody></table></div>`).join('');
    body = `<div class="row between"><div class="stack"><p class="eyebrow">${fmtDate(w.startedAt)}</p><h2>${esc(w.routineName)}</h2></div><button class="iconbtn" data-act="sheet-close" aria-label="Close">✕</button></div>

function viewProgress() {
  const now = Date.now(), wk = startOfWeek(now);
  const thisWeek = S.workouts.filter(w => w.startedAt >= wk).length;
  // consecutive weeks with at least one workout; an empty current week doesn't break the streak yet
  const inWeek = t => S.workouts.some(w => w.startedAt >= t && w.startedAt < t + 7 * DAY);
  let streak = 0;
  for (let t = inWeek(wk) ? wk : wk - 7 * DAY; inWeek(t) && streak < 520; t -= 7 * DAY) streak++;
  // consistency grid: 12 weeks × 7 days
  const days = new Set(S.workouts.map(w => startOfDay(w.startedAt)));
  const first = wk - 11 * 7 * DAY;
  let grid = '';
  ['M','','W','','F','','S'].forEach((dl, d) => {
    grid += `<span class="dl">${dl}</span>`;
    for (let c = 0; c < 12; c++) { const t = first + c * 7 * DAY + d * DAY; grid += `<span class="c ${t > now ? 'fut' : days.has(t) ? 'on' : ''}"></span>`; }
  });
  // weekly sets per muscle (last 7 days)
  const since = now - 7 * DAY, counts = {};
  for (const w of S.workouts) if (w.startedAt >= since) for (const e of w.exercises) counts[e.muscle || 'Other'] = (counts[e.muscle || 'Other'] || 0) + working(e).length;
  const maxC = 24;
  const bars = MUSCLES.map(m => { const c = counts[m] || 0; return `<div class="mbar"><span>${m}</span><div class="tr"><div class="band" style="left:${10 / maxC * 100}%;width:${10 / maxC * 100}%"></div><div class="val" style="width:${Math.min(100, c / maxC * 100)}%"></div></div><span class="num" style="text-align:right">${c}</span></div>`; }).join('');
  // exercise chart
  const lib = libraryExercises().filter(x => S.workouts.some(w => w.exercises.some(e => e.exId === x.id && working(e).length)));
  if (!S.progressEx || !lib.some(x => x.id === S.progressEx)) S.progressEx = lib[0] ? lib[0].id : null;
  const chart = S.progressEx ? exerciseChart(S.progressEx) : '';
  return `${brand('Progress')}${storageBanner()}
    <div class="stats"><div class="stat"><b class="num">${S.workouts.length}</b><span>Workouts</span></div><div class="stat"><b class="num">${thisWeek}/${S.profile.weeklyGoal || 4}</b><span>This week</span></div><div class="stat"><b class="num">${streak}</b><span>Week streak</span></div></div>
    <section class="card"><div class="row between"><h3>Strength trend</h3></div>
      ${lib.length ? `<label class="field">Exercise<select id="prog-ex" data-in="prog-ex">${lib.map(x => `<option value="${esc(x.id)}" ${x.id === S.progressEx ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>${chart}`
      : `<div class="empty">Log a workout and your estimated one-rep max for each lift is charted here.</div>`}
    </section>
    <section class="card"><div class="stack"><h3>Sets per muscle, last 7 days</h3><span class="small muted">The green band marks 10–20 hard sets a week, a common range for growth.</span></div>${bars}</section>
    <section class="card"><h3>Last 12 weeks</h3><div class="grid12">${grid}</div></section>`;
}
function exerciseChart(exId) {
  const pts = [];
  for (const w of [...S.workouts].reverse()) {
    const e = w.exercises.find(x => x.exId === exId); if (!e) continue;
    const ws = working(e); if (!ws.length) continue;
    let best = null;
    for (const s of ws) {
      const wt = conv(s.w, w.unit) || 0;
      const v = e.timed ? s.r : (wt > 0 ? e1rm(wt, s.r) : s.r);
      if (!best || v > best.v) best = {v, label: e.timed ? `${s.r}s` : (wt > 0 ? `${fmtW(wt)} × ${s.r}` : `${s.r} reps`)};
    }
    pts.push({t: w.startedAt, v: best.v, label: best.label, timed: e.timed, bw: !e.timed && !(ws.some(s => s.w > 0))});
  }
  if (!pts.length) return '';
  const metric = pts[0].timed ? 'Longest hold (s)' : pts[0].bw ? 'Best reps' : `Estimated 1RM (${unit()})`;
  const W = 320, H = 170, L = 36, R = 12, T = 12, B = 26;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < 1) { lo -= 5; hi += 5; } const padv = (hi - lo) * .15; lo = Math.max(0, lo - padv); hi += padv;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = Math.max(1, t1 - t0);
  const x = t => pts.length === 1 ? L + (W - L - R) / 2 : L + (t - t0) / span * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`).join('');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `<path d="${line}L${x(t1)},${H - B}L${x(t0)},${H - B}Z" fill="var(--accent-soft)"/>` : '';
  const last = pts[pts.length - 1], bestPt = pts.reduce((a, b) => b.v > a.v ? b : a);
  const dl = t => new Date(t).toLocaleDateString(undefined, {month:'short', day:'numeric'});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(metric)} over time">${ticks}${area}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="${p === last ? 5 : 3}" fill="${p === bestPt ? 'var(--pr)' : 'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
    <text x="${L}" y="${H - 8}">${dl(t0)}</text>${pts.length > 1 ? `<text x="${W - R}" y="${H - 8}" text-anchor="end">${dl(t1)}</text>` : ''}</svg></div>
    <div class="row between small"><span class="muted">${esc(metric)}</span><span class="num">Latest <b>${Math.round(last.v)}</b> · Best <b style="color:var(--pr)">${Math.round(bestPt.v)}</b> (${esc(bestPt.label)})</span></div>`;
}

      <div class="row"><button class="btn primary grow" type="submit" data-mode="in" ${S.authBusy ? 'disabled' : ''}>Sign in</button><button class="btn grow" type="submit" data-mode="up" ${S.authBusy ? 'disabled' : ''}>Create account</button></div>

async function authSubmit(mode) {
  const email = (document.getElementById('auth-email').value || '').trim(), pw = document.getElementById('auth-pw').value || '';
  S.authEmail = email;
  if (!email || pw.length < 6) { S.authMsg = 'Enter your email and a password of at least 6 characters.'; render(); return; }
  S.authBusy = true; S.authMsg = ''; render();
  try {
    const {data, error} = mode === 'up' ? await Sync.signUp(email, pw) : await Sync.signIn(email, pw);
    if (error) S.authMsg = error.message === 'Invalid login credentials' ? 'That email and password don’t match. Created your account already? Confirm it from the email first.' : error.message;
    else if (mode === 'up' && !data.session) S.authMsg = '✓ Account created. Open the confirmation email, then come back here and sign in.';
    else S.authMsg = '';
  } catch (e) { S.authMsg = navigator.onLine ? 'Couldn’t reach the server. Try again in a moment.' : 'You’re offline. Connect to the internet to sign in.'; }
  S.authBusy = false; render();
}

/* ---------- body: weigh-ins, scans and the composition avatar ---------- */
// InBody reports five segments; this is the order its result sheet lists them.
const SEGS = [{k: 'ra', name: 'Right arm'}, {k: 'la', name: 'Left arm'}, {k: 'tr', name: 'Trunk'}, {k: 'rl', name: 'Right leg'}, {k: 'll', name: 'Left leg'}];
// Reference segment masses (kg) for a typical trained adult; the avatar's base proportions are drawn at these.
const REF = {lean: {ra: 3.3, la: 3.3, tr: 26, rl: 9.2, ll: 9.2}, fat: {ra: 1.0, la: 1.0, tr: 9, rl: 2.8, ll: 2.8}};
// Typical share of fat-free mass and fat mass per segment, used only when a scan has totals but no segments.
const SEG_SHARE = {lean: {ra: .055, la: .055, tr: .45, rl: .165, ll: .165}, fat: {ra: .06, la: .06, tr: .5, rl: .15, ll: .15}};
const KG = 0.453592;
const toKg = (v, u) => v == null || v === '' || isNaN(v) ? null : (u === 'kg' ? +v : v * KG);
const fromKg = kg => kg == null ? null : (unit() === 'kg' ? kg : kg / KG);
const f1 = n => n == null || isNaN(n) ? '—' : (Math.round(n * 10) / 10).toFixed(1);
const scans = () => S.body.filter(e => e.kind === 'scan').sort((a, b) => a.date - b.date);
const localISO = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };

function weightSeries() {
  // one reading per day: a weigh-in beats a scan's weight on the same day
  const byDay = new Map();
  for (const e of S.body) {
    const w = e.kind === 'weight' ? e.w : e.weight; if (!(w > 0)) continue;
    const d = startOfDay(e.date), prev = byDay.get(d);
    if (!prev || (e.kind === 'weight' && prev.kind !== 'weight') || (e.kind === prev.kind && e.date > prev.date))
      byDay.set(d, {t: d, kg: toKg(w, e.unit), kind: e.kind, id: e.id});
  }
  const pts = [...byDay.values()].sort((a, b) => a.t - b.t);
  // trend = average of the readings in the 7 days up to each point, which smooths out water and salt swings
  pts.forEach((p, i) => { let s = 0, n = 0; for (let j = i; j >= 0 && p.t - pts[j].t < 7 * DAY; j--) { s += pts[j].kg; n++; } p.trend = s / n; });

  const n = span.length, mx = span.reduce((s, p) => s + p.t, 0) / n, my = span.reduce((s, p) => s + p.trend, 0) / n;
  let num = 0, den = 0; for (const p of span) { num += (p.t - mx) * (p.trend - my); den += (p.t - mx) ** 2; }

  const target = g.type === 'cut' ? -Math.abs(g.rate) : g.type === 'bulk' ? Math.abs(g.rate) : 0;
  const tol = Math.max(Math.abs(target) * 0.3, unit() === 'kg' ? 0.1 : 0.25);
  if (Math.abs(rate - target) <= tol) return {tone: 'up', text: 'On pace'};
  if (g.type === 'maintain') return {tone: 'hold', text: rate > 0 ? 'Gaining' : 'Losing'};
  const fast = g.type === 'cut' ? rate < target : rate > target;

    let lean = k(src.lean), fat = k(src.fat);

    if (fat == null) { fat = bfm != null ? bfm * SEG_SHARE.fat[key] : REF.fat[key]; est = true; }

    if (ev.target.classList.contains('scrim')) { S.sheet = null; disarm(); render(); } },
  'add-ex-open': () => { S.sheet = {type:'add-ex', q:''}; render(); },
  'add-ex': d => { const ex = libraryExercises().find(x => x.id === d.v); if (!ex) return; S.active.exercises.push(buildEx(ex)); S.sheet = null; saveActiveSoon(); render(); window.scrollTo(0, document.body.scrollHeight); },
  'add-custom': () => {
    const name = (S.sheet.q || '').trim(); if (!name) return;
    const muscle = document.getElementById('add-m').value, kind = document.getElementById('add-k').value;
    S.active.exercises.push(buildEx({id: slug(name), name, sets: 3, repMin: 8, repMax: 12, kind, muscle, rest: 90, timed: false}));
    S.sheet = null; saveActiveSoon(); render(); window.scrollTo(0, document.body.scrollHeight);
  },
  detail: d => { S.sheet = {type:'detail', id:d.v}; render(); },
  'del-workout': d => { if (!arm('del' + d.v)) return; disarm(); S.workouts = S.workouts.filter(w => w.id !== d.v); S.sheet = null; store.deleteWorkout(d.v); recomputePRs(); render(); toast('Workout deleted'); },
  'ed-open': d => openEditor(d.v),
  'ed-cancel': () => { S.sheet = {type: 'detail', id: S.sheet.id}; render(); },
  'ed-save': () => saveEditor(),
  'ed-warm': d => { const s = S.sheet.edit.exercises[+d.e].sets[+d.s]; s.warm = !s.warm; render(); },
  'ed-add-set': d => { const e = S.sheet.edit.exercises[+d.e], l = e.sets[e.sets.length - 1]; e.sets.push({w: l ? l.w : null, r: null, done: true, warm: false}); render(); },
  'ed-rm-set': d => { S.sheet.edit.exercises[+d.e].sets.splice(+d.s, 1); render(); },
  'ed-rm-ex': d => { S.sheet.edit.exercises.splice(+d.e, 1); render(); },
  'ed-add-ex': () => {
    const x = libraryExercises().find(e => e.id === document.getElementById('ed-add-sel').value); if (!x) return;
    S.sheet.edit.exercises.push({exId: x.id, name: x.name, kind: x.kind, muscle: x.muscle, repMin: x.repMin, repMax: x.repMax, rest: x.rest, timed: !!x.timed, target: x.sets, sets: [{w: null, r: null, done: true, warm: false}]});
    render();
  },
  'dismiss-summary': () => { S.summary = null; render(); },
  'sync-now': () => Sync.run(true),
  'share-open': d => { S.sheet = {type: 'share', id: d.v}; render(); prepareShare(); },
  'share-theme': d => { if ((S.profile.shareTheme || 'dark') === d.v) return; S.profile.shareTheme = d.v; store.saveProfile(); const sh = S.sheet; if (sh.url) URL.revokeObjectURL(sh.url); sh.url = null; sh.blob = null; render(); prepareShare(); },
  'share-go': () => shareGo(),
  'scan-open': d => { S.sheet = {type: 'scan', id: d.v || null}; S.scanMsg = ''; disarm(); render(); },
  'scan-del': d => { if (!arm('scandel')) return; disarm(); S.body = S.body.filter(e => e.id !== d.v); store.deleteBody(d.v); S.sheet = null; S.scanIdx = null; render(); toast('Scan deleted'); },
  seg: d => { S.bodySeg = S.bodySeg === d.v ? null : d.v; render(); },
  'scan-compare': d => { S.scanCompare = d.v; render(); },
  'wt-range': d => { S.wtRange = d.v === 'all' ? 'all' : +d.v; render(); },
  'wt-all': () => { S.wtAll = true; S.wtOpen = true; render(); },
  'wt-del': d => { if (!arm('wtdel' + d.v)) return; disarm(); S.body = S.body.filter(e => e.id !== d.v); store.deleteBody(d.v); S.wtOpen = true; render(); toast('Weigh-in deleted'); },
  goal: d => { const g = S.profile.goal || {}; S.profile.goal = {type: d.v, rate: g.rate || (unit() === 'kg' ? 0.25 : 0.5)}; store.saveProfile(); render(); },
  'sign-out': async () => { if (!arm('signout')) return; disarm(); await Sync.signOut(); S.authMsg = '✓ Signed out. Your log stays on this phone.'; render(); },
  'edit-routine': d => { S.editRoutine = d.v || null; disarm(); render(); },
  'p-up': d => { const xs = S.program.routines[+d.r].exercises, i = +d.x; if (i > 0) { [xs[i - 1], xs[i]] = [xs[i], xs[i - 1]]; saveProgramSoon(); render(); } },
  'p-rm': d => { if (!arm(`prm${d.r}-${d.x}`)) return; disarm(); S.program.routines[+d.r].exercises.splice(+d.x, 1); saveProgramSoon(); render(); },
  'p-add': d => { const r = S.program.routines[+d.r]; r.exercises.push({id: slug('New exercise ' + (r.exercises.length + 1)), name: 'New exercise ' + (r.exercises.length + 1), sets: 3, repMin: 8, repMax: 12, kind: 'machine', muscle: 'Chest', rest: 90, timed: false}); saveProgramSoon(); render(); },
  unit: d => { if (S.profile.unit === d.v) return; const was = S.profile.unit; S.profile.unit = d.v; if (Number(S.profile.bar) === (was === 'kg' ? 20 : 45)) S.profile.bar = d.v === 'kg' ? 20 : 45; store.saveProfile(); render(); },
  'reset-program': () => { if (!arm('reset')) return; disarm(); S.program = JSON.parse(JSON.stringify(TEMPLATE)); S.editRoutine = null; store.saveProgram(); render(); toast('Program reset'); },
  'export-json': () => offerFile(`liftbook-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({app:'liftbook', version:1, exportedAt:new Date().toISOString(), profile:S.profile, program:S.program, workouts:S.workouts, body:S.body}, null, 2)),
  'export-csv': () => {
    const rows = [['date','routine','exercise','set','warmup','weight','unit','reps_or_seconds']];
    for (const w of [...S.workouts].reverse()) for (const e of w.exercises) e.sets.forEach((s, i) => rows.push([new Date(w.startedAt).toISOString(), w.routineName, e.name, i + 1, s.warm ? 1 : 0, s.w ?? '', w.unit, s.r ?? '']));
    offerFile(`liftbook-sets-${new Date().toISOString().slice(0, 10)}.csv`, rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\n'));
  }
};
function markBackup(filename) { if (filename.endsWith('.json')) { S.profile.lastBackup = Date.now(); store.saveProfile(); render(); } }
async function offerFile(filename, data) {
  if (IN_CLAUDE) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch {}
    if (dl) { try { await dl.save({filename, data}); markBackup(filename); } catch (e) { if (e && e.code !== 'declined') toast('Could not save the file here.'); } return; }
  }
  const type = filename.endsWith('.csv') ? 'text/csv' : 'application/json';
  // phones: the share sheet offers Save to Files / Drive / email
  try {
    const file = new File([data], filename, {type});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: filename}); markBackup(filename); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); markBackup(filename); return;
  } catch {}
  try { await navigator.clipboard.writeText(data); toast('Copied to clipboard'); } catch { toast('Saving files is not available here.'); }
}

document.addEventListener('click', ev => {
  unlockAudio();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'scrim' && el !== ev.target) return;
  fn(el.dataset, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'w' || k === 'r') {
    const e = S.active.exercises[+el.dataset.e], s = e.sets[+el.dataset.s];
    const v = el.value.trim() === '' ? null : parseFloat(el.value.replace(',', '.'));
    const old = s[k];
    s[k] = v == null || isNaN(v) ? null : (k === 'r' ? Math.round(v) : v);
    // a new weight carries down to the unfinished sets below that were blank or matched the old weight
    if (k === 'w' && s.w != null) e.sets.forEach((x, i) => {
      if (i <= +el.dataset.s || x.done || !(x.w == null || x.w === old)) return;
      x.w = s.w; const inp = document.getElementById(`w-${el.dataset.e}-${i}`); if (inp) inp.value = fmtW(s.w);
    });
    if (k === 'w' && e.kind === 'barbell') { const box = document.getElementById('plates-' + el.dataset.e); if (box) box.innerHTML = platesHTML(e.sets.map(x => x.w).filter(x => x > 0).pop() || 0); }
    saveActiveSoon();
  } else if (k === 'add-q') {
    S.sheet.q = el.value; const pos = el.selectionStart; render();
    const n = document.getElementById('add-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
  } else if (k.startsWith('p-')) {
    const ex = S.program.routines[+el.dataset.r].exercises[+el.dataset.x], f = k.slice(2);
    if (f === 'name') { const nm = el.value.trim(); if (nm) { ex.name = nm; ex.id = slug(nm); } }
    else { const n = parseInt(el.value, 10); if (n > 0) ex[f] = n; if (ex.repMax < ex.repMin && f !== 'rest' && f !== 'sets') {} }
    saveProgramSoon();
  } else if (k === 'auth-email') { S.authEmail = el.value;
  } else if (k === 'scan-idx') { showScan(+el.value);
  } else if (k === 'ed-w' || k === 'ed-r') {
    const s = S.sheet.edit.exercises[+el.dataset.e].sets[+el.dataset.s], t = el.value.trim().replace(',', '.');
    const v = t === '' ? null : parseFloat(t); s[k === 'ed-w' ? 'w' : 'r'] = v == null || isNaN(v) ? null : (k === 'ed-r' ? Math.round(v) : v);
  } else if (k === 'ed-date') { S.sheet.edit.dateStr = el.value;
  } else if (k === 'ed-dur') { S.sheet.edit.durMin = el.value;
  } else if (k === 'goal-rate') { const n = parseFloat(el.value); if (n > 0 && n < 5) { S.profile.goal = {...(S.profile.goal || {type: 'cut'}), rate: n}; later('profile', () => store.saveProfile()); }
  } else if (k === 'bar') { const n = parseFloat(el.value); if (n >= 0) { S.profile.bar = n; later('profile', () => store.saveProfile()); } }
  else if (k === 'goal') { const n = parseInt(el.value, 10); if (n > 0 && n < 15) { S.profile.weeklyGoal = n; later('profile', () => store.saveProfile()); } }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.in === 'prog-ex') { S.progressEx = el.value; render(); }
  if (el.dataset && el.dataset.in && el.dataset.in.startsWith('p-')) render();
  if (el.id === 'import-file' && el.files && el.files[0]) importFile(el.files[0]);
});
document.addEventListener('submit', ev => {
  const id = ev.target.id;
  if (!['auth-form', 'wt-form', 'scan-form'].includes(id)) return;
  ev.preventDefault();
  if (id === 'auth-form') authSubmit(ev.submitter && ev.submitter.dataset.mode === 'up' ? 'up' : 'in');
  if (id === 'wt-form') logWeight();
  if (id === 'scan-form') saveScanForm();
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'wt-details') S.wtOpen = ev.target.open; }, true);
async function importFile(file) {
  try {
    const o = JSON.parse(await file.text());
    if (!o || !Array.isArray(o.workouts)) throw new Error('bad');
    const have = new Set(S.workouts.map(w => w.id)); let added = 0;
    for (const w of o.workouts) if (w && w.id && Array.isArray(w.exercises) && !have.has(w.id)) { S.workouts.push(w); added++; store.saveWorkout(w); }
    S.workouts.sort((a, b) => b.startedAt - a.startedAt);
    const haveB = new Set(S.body.map(e => e.id));
    for (const e of (Array.isArray(o.body) ? o.body : [])) if (e && e.id && e.kind && !haveB.has(e.id)) { S.body.push(e); store.saveBody(e); }
    S.body.sort((a, b) => b.date - a.date);
    if (o.program && Array.isArray(o.program.routines)) { S.program = o.program; store.saveProgram(); }
    if (o.profile && o.profile.unit) { S.profile = {...DEFAULT_PROFILE, ...o.profile}; store.saveProfile(); }
    store.persistLocal(); render(); toast(`Imported ${added} workout${added === 1 ? '' : 's'}`);
  } catch { toast('That file is not a Liftbook backup.'); }
}

/* ---------- boot ---------- */
(async () => {
  const d = store.load();
  S.meta = d.meta;
  S.profile = {...DEFAULT_PROFILE, ...(d.profile || {})};
  S.program = d.program || JSON.parse(JSON.stringify(TEMPLATE));
  S.workouts = (d.workouts || []).sort((a, b) => b.startedAt - a.startedAt);
  S.body = (d.body || []).sort((a, b) => b.date - a.date);
  S.active = d.active || null;
  // defaults keep a zero timestamp so they never overwrite a program already saved in the cloud
  if (!d.program || !d.profile) store.persistLocal();
  S.ready = true; render();
  // ask the browser not to evict the log when storage runs low
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  await Sync.init(); render();
})();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
